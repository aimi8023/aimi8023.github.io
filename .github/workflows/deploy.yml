name: Deploy

on:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npx hexo generate
      - name: Push to gh-pages
        run: |
          cd public
          git init
          git config user.name github-actions
          git config user.email actions@github.com
          git add -A
          git commit -m deploy
          git push -f https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/aimi8023/aimi8023.github.io.git HEAD:gh-pages
