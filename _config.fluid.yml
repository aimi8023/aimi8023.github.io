#---------------------------
# Hexo Theme Fluid - 自定义配置
#---------------------------

# 导航栏标题
favicon: /img/fluid.png
apple_touch_icon: /img/fluid.png

color:
  body_bg_color: "#f4f1e8"
  body_bg_color_dark: "#151719"
  navbar_bg_color: "#173f45"
  navbar_bg_color_dark: "#101f22"
  post_link_color: "#b34f5f"
  post_link_color_dark: "#ef8fa0"
  link_hover_color: "#176c70"
  link_hover_color_dark: "#70c6c5"

custom_css: /css/custom.css

canonical:
  enable: true

open_graph:
  enable: true
  image: /images/brand/calm-night-background.webp
  twitter_card: summary_large_image

navbar:
  blog_title: "艾米"
  menu:
    - { key: "home", link: "/", icon: "iconfont icon-home-fill" }
    - { key: "articles", link: "/articles/", icon: "iconfont icon-archive-fill", name: "文章" }
    - { key: "projects", link: "/projects/", icon: "iconfont icon-tags-fill", name: "作品" }
    - { key: "tools", link: "/tools/", icon: "iconfont icon-appstore-fill", name: "工具箱" }
    - { key: "about", link: "/about/", icon: "iconfont icon-user-fill" }
# 搜索
search:
  enable: true

# 首页
index:
  banner_img: /images/brand/calm-night-background.webp
  banner_img_height: 62
  banner_mask_alpha: 0.08
  slogan:
    enable: false
    text: "全栈与 AI 学习笔记"

# 文章页

post:
  banner_img: /images/brand/calm-night-background.webp
  banner_img_height: 38
  banner_mask_alpha: 0.2
  meta:
    author:
      enable: true
    date:
      enable: true
    wordcount:
      enable: true
    min2read:
      enable: true
    views:
      enable: true
      source: busuanzi
  updated:
    enable: true
    date_format: "YYYY-MM-DD"
    relative: false
    note_class: info
  copyright:
    enable: true
    license: 'BY-NC-SA'
    author:
      enable: true
  comments:
    enable: false

# 关于页
about:
  enable: true
  banner_img: /images/brand/calm-night-background.webp
  banner_img_height: 38
  banner_mask_alpha: 0.2
  avatar: /img/avatar.png
  name: "艾米"
  intro: "计算机研究生 · 记录全栈开发与 AI 学习"
  icons:
    - { class: "iconfont icon-github-fill", link: "https://github.com/aimi8023", tip: "GitHub" }
    - { class: "iconfont icon-mail-fill", link: "mailto:2722714532@qq.com", tip: "邮箱" }

# 归档页
archive:
  banner_img: /images/brand/calm-night-background.webp
  banner_img_height: 34
  banner_mask_alpha: 0.2

# 分类页
category:
  enable: true
  banner_img: /images/brand/calm-night-background.webp
  banner_img_height: 34
  banner_mask_alpha: 0.2

# 标签页
tag:
  enable: true
  banner_img: /images/brand/calm-night-background.webp
  banner_img_height: 34
  banner_mask_alpha: 0.2

# 自定义页
page:
  banner_img: /images/brand/calm-night-background.webp
  banner_img_height: 34
  banner_mask_alpha: 0.2

page404:
  enable: true
  banner_img: /images/brand/calm-night-background.webp
  banner_img_height: 62
  banner_mask_alpha: 0.2

links:
  enable: false

# 页脚
footer:
  content: '
    <a href="https://hexo.io" target="_blank" rel="nofollow noopener"><span>Hexo</span></a>
    <i class="iconfont icon-love"></i>
    <a href="https://github.com/fluid-dev/hexo-theme-fluid" target="_blank" rel="nofollow noopener"><span>Fluid</span></a>
  '
  statistics:
    enable: true
    source: busuanzi

# 暗色模式
dark_mode:
  enable: true
  default: auto

# 代码高亮
code:
  highlight:
    enable: true
    lib: "highlightjs"
    highlightjs:
      style: "github gist"
      style_dark: "dark"

# 打字机效果
fun_features:
  typing:
    enable: false
    typeSpeed: 70
    cursorChar: "_"
    loop: false


